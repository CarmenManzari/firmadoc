<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firma Documento — FINALE FIX stabile + editabile</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0} body{font-family:Arial;background:#f5f5f5;min-height:100vh}
.hdr{background:#1a1a1a;color:#fff;padding:14px 20px} .wrap{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:16px;margin-bottom:12px}
.pdf-wrap{border:2px solid #e0e0e0;border-radius:8px;overflow:hidden;background:#888}
.pdf-canvas{display:block;width:100%}
.btn{width:100%;padding:12px;border-radius:8px;font-weight:700;border:none;cursor:pointer;margin-top:8px}
.btn-primary{background:#1a1a1a;color:#fff} .btn-green{background:#2d7a3a;color:#fff}
.firma-box{border:2px dashed #e8a020;border-radius:8px;background:#fff;overflow:hidden;margin-bottom:12px}
.firma-canvas{display:block;width:100%;height:200px;touch-action:none;cursor:crosshair}
.firma-label{font-size:12px;font-weight:700;padding:8px 12px;background:#f5f5f5;display:flex;justify-content:space-between}
.campo-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px} .campo-row label{font-size:10px;font-weight:700;color:#999;text-transform:uppercase}
.campo-row input{padding:10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:20px;font-size:12px;opacity:0;transition:.25s;pointer-events:none} .toast.show{opacity:1}
.istr{font-size:11px;background:#EAF3DE;padding:8px 10px;border-radius:6px;margin-bottom:10px;color:#27500A}
</style>
</head>
<body>
<div class="hdr">⚡ Professione Tutela Utenze — Firma (FIX stabile + campi editabili)</div>
<div class="wrap">
<div id="stato" class="card" style="text-align:center;padding:30px"><div id="stato_t">Caricamento documento...</div></div>
<div id="anteprima" style="display:none" class="card"><div style="font-size:11px;font-weight:700;color:#666;margin-bottom:8px">📄 Documento</div><div class="pdf-wrap"><canvas id="pdf_canvas" class="pdf-canvas"></canvas></div><button class="btn btn-primary" onclick="vaiFirma()">✍️ Procedi alla firma</button></div>
<div id="schermo_firma" style="display:none">
<div class="card"><div style="font-weight:700;font-size:12px;margin-bottom:8px">📝 Verifica i tuoi dati — ora puoi modificarli (PDF editabile)</div>
<div class="istr">✅ Puoi correggere i dati qui prima di firmare. Verranno salvati nel PDF finale.</div>
<div class="campo-row"><label>Luogo firma</label><input id="inp_luogo" placeholder="Bari"></div>
<div class="campo-row"><label>Data</label><input id="inp_data" type="date"></div>
<div id="campi_editabili"></div></div>
<div id="firme_container"></div>
<button id="btn_invia" class="btn btn-green" onclick="invia()">📤 Invia documento firmato</button>
</div>
</div>
<div id="toast" class="toast"></div>
<script>
firebase.initializeApp({apiKey:"AIzaSyCVqrDWJDLtyGUzPBtvkHOMxBERO4ixKX0",authDomain:"crm-servizi.firebaseapp.com",projectId:"crm-servizi"});
const db=firebase.firestore();
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let invioData=null, templateData=null, docInvioId=null, pdfDoc=null, firme=[];
const params=new URLSearchParams(location.search); docInvioId=params.get('id');

async function init(){
  if(!docInvioId){ document.getElementById('stato_t').textContent='ID mancante'; return; }
  const invioSnap=await db.collection('mod_invii').doc(docInvioId).get(); if(!invioSnap.exists){ document.getElementById('stato_t').textContent='Invio non trovato'; return; }
  invioData=invioSnap.data(); const tplSnap=await db.collection('mod_templates').doc(invioData.templateId).get(); templateData=tplSnap.data();
  await caricaPdf(); document.getElementById('stato').style.display='none'; document.getElementById('anteprima').style.display='block';
}
async function caricaPdf(){
  const b64=templateData.pdfData.split(',')[1]; const bin=atob(b64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  pdfDoc=await pdfjsLib.getDocument({data:bytes}).promise; const page=await pdfDoc.getPage(1); const vp=page.getViewport({scale:1.5}); const cv=document.getElementById('pdf_canvas'); cv.width=vp.width; cv.height=vp.height; await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
}
function vaiFirma(){
  document.getElementById('anteprima').style.display='none'; document.getElementById('schermo_firma').style.display='block';
  const dati=invioData.datiCliente||{}; const box=document.getElementById('campi_editabili');
  box.innerHTML=Object.keys(dati).map(k=>`<div class="campo-row"><label>${k} (editabile)</label><input id="edit_${k}" value="${String(dati[k]||'').replace(/"/g,'&quot;')}"></div>`).join('');
  const cont=document.getElementById('firme_container'); const elementi=templateData.elementi||[]; firme=[];
  cont.innerHTML=elementi.filter(e=>e.tipo==='firma').map((el,idx)=>{
    firme.push({pagina:el.pagina||1, xPct:el.xPct, yPct:el.yPct, wPct:el.wPct||0.26, hPct:el.hPct||0.065, dataUrl:null});
    return `<div class="card"><div class="firma-label"><span>Firma ${idx+1} — Pagina ${el.pagina||1}</span><span id="badge_${idx}" style="font-size:10px;background:#FEF3E2;padding:2px 8px;border-radius:10px">In attesa</span></div><div class="firma-box"><canvas class="firma-canvas" id="cv_${idx}"></canvas></div><button class="btn" style="background:#fff;border:1px solid #e0e0e0" onclick="pulisci(${idx})">Pulisci</button></div>`;
  }).join(''); setTimeout(initCanvases,100);
}
function initCanvases(){
  firme.forEach((f,i)=>{
    const cv=document.getElementById('cv_'+i); const dpr=window.devicePixelRatio||1; const rect=cv.getBoundingClientRect(); cv.width=rect.width*dpr; cv.height=200*dpr; const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f193c'; f.canvas=cv; f.ctx=ctx;
    let dis=false,last=null; function pos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
    function start(e){ e.preventDefault(); dis=true; last=pos(e); } function move(e){ if(!dis) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; } function end(){ if(!dis) return; dis=false; f.dataUrl=cv.toDataURL('image/png'); document.getElementById('badge_'+i).textContent='✓ Firmato'; document.getElementById('badge_'+i).style.background='#EAF3DE'; }
    cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',end);
  });
}
function pulisci(i){ const f=firme[i]; f.ctx.clearRect(0,0,f.canvas.width,f.canvas.height); f.dataUrl=null; document.getElementById('badge_'+i).textContent='In attesa'; document.getElementById('badge_'+i).style.background='#FEF3E2'; }
async function invia(){
  if(firme.some(f=>!f.dataUrl)){ toast('Firma tutti i campi'); return; }
  const btn=document.getElementById('btn_invia'); btn.disabled=true; btn.textContent='⏳ Invio...';
  const luogo=document.getElementById('inp_luogo').value||''; const dataV=document.getElementById('inp_data').value||'';
  const datiEditati={}; document.querySelectorAll('[id^="edit_"]').forEach(inp=>{ const k=inp.id.replace('edit_',''); datiEditati[k]=inp.value; });
  const firmeElab=firme.map(f=>({pagina:f.pagina, dataUrl:f.dataUrl, pos:{xPct:f.xPct,yPct:f.yPct}, wPct:f.wPct, hPct:f.hPct}));
  try{
    await db.collection('mod_firmati').add({clienteId:invioData.clienteId||'', nomeCliente:invioData.nomeCliente||'', nomeModulo:templateData.nome||'', templateId:invioData.templateId, invioId:docInvioId, firmeData:firmeElab, luogo, data:dataV, datiEditati, timestamp:new Date().toISOString()});
    // Notifica
    try{ fetch('https://api.telegram.org/bot8878679679:AAEPAXzymdP5p_CwnLZN4zMnn0gDHmkQR9A/sendMessage?chat_id=5657428829&text='+encodeURIComponent('✅ Nuova firma FIX: '+(invioData.nomeCliente||'')+' - '+(templateData.nome||''))); }catch(e){}
    document.getElementById('schermo_firma').innerHTML='<div class="card" style="text-align:center;padding:40px"><div style="font-size:40px">✅</div><div style="font-weight:700;margin-top:10px">Documento firmato!</div><div style="font-size:13px;color:#666;margin-top:6px">Grazie, il consulente riceverà il PDF corretto.</div></div>';
  }catch(e){ toast('Errore '+e.message); btn.disabled=false; btn.textContent='📤 Invia'; }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }
init();
</script>
</body>
</html>
