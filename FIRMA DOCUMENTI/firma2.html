<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.hdr{background:#1a1a1a;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.hdr-logo{font-size:14px;font-weight:700}.hdr-logo em{color:#e8a020;font-style:normal}
.hdr-mod{font-size:12px;color:#aaa;margin-top:2px}
.wrap{max-width:600px;margin:0 auto;padding:20px 16px 48px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:18px;margin-bottom:12px}
.card-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#666;margin-bottom:10px}
.stato{text-align:center;padding:40px 20px}
.stato-icon{font-size:48px;margin-bottom:12px}
.stato-titolo{font-size:18px;font-weight:700;margin-bottom:6px}
.stato-sub{font-size:13px;color:#666;line-height:1.5}
.spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#1a1a1a;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.pdf-wrap{border:2px solid #e0e0e0;border-radius:8px;overflow:hidden;margin-bottom:10px;background:#888}
.pdf-canvas{display:block;width:100%}

.btn-primary{background:#1a1a1a;color:#fff}.btn-primary:hover{background:#333}
.btn-primary:disabled{background:#ccc;cursor:not-allowed}
.btn-secondary{background:#fff;color:#1a1a1a;border:1.5px solid #e0e0e0}
.btn-green{background:#2d7a3a;color:#fff}
.firma-box{border:2px dashed #e0e0e0;border-radius:8px;background:#fafafa;margin-bottom:10px;overflow:hidden}
.firma-canvas{display:block;touch-action:none;cursor:crosshair}

.firma-attiva{border-color:#e8a020;background:#FEF3E2}

<script>

var P = new URLSearchParams(window.location.search);

var invioData = null;
var pdfDoc = null;
var pdfBytes = null;

// ===== UI =====
function showStato(titolo, sub, spinner) {
  document.getElementById('schermo_stato').style.display = 'block';
  document.getElementById('schermo_anteprima').style.display = 'none';
  document.getElementById('schermo_firma').style.display = 'none';
  document.getElementById('spinner').style.display = spinner ? 'block' : 'none';
  document.getElementById('stato_titolo').textContent = titolo;
  document.getElementById('stato_sub').textContent = sub || '';
}

function showAnteprima() {
  document.getElementById('schermo_stato').style.display = 'none';
  document.getElementById('schermo_anteprima').style.display = 'block';
  document.getElementById('schermo_firma').style.display = 'none';
}

function showFirma() {
  document.getElementById('schermo_stato').style.display = 'none';
  document.getElementById('schermo_anteprima').style.display = 'none';
  document.getElementById('schermo_firma').style.display = 'block';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

// ===== INIT =====
document.getElementById('inp_data').value = new Date().toISOString().split('T')[0];

async function init() {
  showStato('Caricamento documento...', '', true);

  if (!docInvioId) {
    showStato('Link non valido', 'Contatta il consulente per un nuovo link.', false);
    return;
  }

  try {
    // Carica invio
    var invioDoc = await db.collection('mod_invii').doc(docInvioId).get();
    if (!invioDoc.exists) {
      showStato('Link non valido', 'Il link potrebbe essere scaduto. Contatta il consulente.', false);
      return;
    }
    invioData = invioDoc.data();
    document.getElementById('hdr_mod').textContent = invioData.nomeModulo || 'Documento';

    // Carica template
    showStato('Caricamento modulo...', '', true);
    var tplDoc = await db.collection('mod_templates').doc(invioData.templateId).get();
    if (!tplDoc.exists) {
      showStato('Modulo non trovato', 'Contatta il consulente.', false);
      return;
    }
    templateData = tplDoc.data();

    if (!templateData.pdfData) {
      showStato('PDF mancante', 'Ricrea il template e riprova.', false);
      return;
    }

    // Carica PDF
    showStato('Caricamento PDF...', '', true);
    var b64 = templateData.pdfData.split(',')[1];
    var bin = atob(b64);
    pdfBytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) pdfBytes[i] = bin.charCodeAt(i);
    pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
    totalPages = pdfDoc.numPages;

    // Determina firme
    var tutteFirme = [];
    if (templateData.elementi && templateData.elementi.length) {
      tutteFirme = templateData.elementi.filter(function(e){ return e.tipo === 'firma'; });
    } else if (templateData.firme && templateData.firme.length) {
      // Vecchio formato: normalizza pos.xPct → xPct
      tutteFirme = templateData.firme.map(function(f) {
        var xPct = f.xPct !== undefined ? f.xPct : (f.pos ? f.pos.xPct : 0);
        var yPct = f.yPct !== undefined ? f.yPct : (f.pos ? f.pos.yPct : 0);
        return { nome: f.nome||'Firma', pagina: f.pagina||1, xPct: xPct, yPct: yPct };
      });
    }

    console.log('Firme trovate:', tutteFirme.length, tutteFirme);

    var idxDaUsare = (invioData.firmeIdx && invioData.firmeIdx.length) ? invioData.firmeIdx : null;
    if (idxDaUsare) {
      firmeAttive = idxDaUsare.filter(function(i){ return i < tutteFirme.length; })
        .map(function(i){ return Object.assign({}, tutteFirme[i], {index:i, dataUrl:null}); });
    } else {
      firmeAttive = tutteFirme.map(function(f,i){ return Object.assign({},f,{index:i,dataUrl:null}); });
    }
    
    console.log('Firme attive:', firmeAttive.length, firmeAttive);

    if (!firmeAttive.length) {
      showStato('Nessuna firma richiesta', 'Contatta il consulente.', false);
      return;
    }

    // Mostra anteprima
    await renderPdfPagina(1);
    showAnteprima();

  } catch(e) {
    showStato('Errore: ' + e.message, 'Riprova o contatta il consulente.', false);
  }
}

// ===== PDF =====
async function renderPdfPagina(n) {
  currentPage = n;
  document.getElementById('pdf_lbl').textContent = 'Pagina ' + n + ' / ' + totalPages;
  var page = await pdfDoc.getPage(n);
  var cv = document.getElementById('pdf_canvas');
  var w = cv.parentElement.offsetWidth || 560;
  var vp = page.getViewport({scale:1});
  var sc = w / vp.width;
  var sv = page.getViewport({scale:sc});
  cv.width = sv.width; cv.height = sv.height;
  await page.render({canvasContext:cv.getContext('2d'), viewport:sv}).promise;
}

function cambiaPg(dir) {
  var n = currentPage + dir;
  if (n >= 1 && n <= totalPages) renderPdfPagina(n);
}

// ===== FIRMA =====
function vaiAFirma() {
  costruisciFirme();
  showFirma();
}

function costruisciFirme() {
  var container = document.getElementById('firme_container');
  container.innerHTML = '';
  firmeAttive.forEach(function(f, i) {
    var div = document.createElement('div');
    div.className = 'card';
    div.id = 'firma_card_' + i;
    div.innerHTML = '<div class="firma-label">✍️ Firma ' + (i+1) + ' <span class="firma-badge badge-attesa" id="badge_' + i + '">In attesa</span></div>' +
      '<div class="firma-box" id="firma_box_' + i + '">' +
        '<canvas class="firma-canvas" id="firma_cv_' + i + '" width="900" height="260"></canvas>' +
        '<div class="firma-info">Disegna la firma qui sopra con il dito o il mouse — usa tutto lo spazio orizzontale</div>' +
      '</div>' +
      '<button class="btn btn-secondary" style="margin-top:4px" onclick="pulisciFirma(' + i + ')">🗑 Cancella</button>';
    container.appendChild(div);
    initCanvas(i);
  });
}

function initCanvas(i) {
  var cv = document.getElementById('firma_cv_' + i);

  // Canvas ad alta risoluzione (2x) per tratto nitido
  var DPR = window.devicePixelRatio || 2;
  var displayW = cv.offsetWidth || 900;
  var displayH = 260;
  cv.width  = displayW * DPR;
  cv.height = displayH * DPR;
  cv.style.width  = displayW + 'px';
  cv.style.height = displayH + 'px';

  var ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR); // tutto il disegno avviene in coordinate CSS

  firmeAttive[i].canvas = cv;
  firmeAttive[i].ctx = ctx;
  firmeAttive[i].disegnando = false;

  // Buffer punti per Bézier smooth
  var punti = [];
  var velocitaMedia = 0;

  function getPos(e) {
    var r = cv.getBoundingClientRect();
    if (e.touches) {
      return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
    }
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  // Calcola spessore dinamico in base alla velocità del gesto
  function calcolaSpessore(dist) {
    // Più veloce = tratto più sottile (come una penna reale)
    velocitaMedia = velocitaMedia * 0.85 + dist * 0.15;
    var sp = 3.5 - Math.min(velocitaMedia * 0.08, 2.2);
    return Math.max(0.8, Math.min(sp, 3.5));
  }

  // Disegna curva quadratica tra i punti accumulati
  function disegnaCurva() {
    if (punti.length < 3) return;
    var len = punti.length;
    var p0 = punti[len - 3];
    var p1 = punti[len - 2];
    var p2 = punti[len - 1];

    // Punto di controllo: metà tra p1 e p2
    var mx = (p1.x + p2.x) / 2;
    var my = (p1.y + p2.y) / 2;

    var dist = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    var sp = calcolaSpessore(dist);

    ctx.beginPath();
    ctx.moveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2);
    ctx.quadraticCurveTo(p1.x, p1.y, mx, my);

    // Inchiostro blu-nero profondo, leggermente trasparente per sovrapposizione naturale
    ctx.strokeStyle = 'rgba(15, 25, 60, 0.88)';
    ctx.lineWidth = sp;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function start(e) {
    e.preventDefault();
    firmeAttive[i].disegnando = true;
    velocitaMedia = 0;
    punti = [];
    var p = getPos(e);
    punti.push(p);
    firmeAttive[i].lx = p.x; firmeAttive[i].ly = p.y;
    // Punto iniziale: piccolo cerchio morbido
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15, 25, 60, 0.88)';
    ctx.fill();
    document.getElementById('firma_box_' + i).className = 'firma-box firma-attiva';
  }

  function move(e) {
    e.preventDefault();
    if (!firmeAttive[i].disegnando) return;
    var p = getPos(e);
    punti.push(p);
    disegnaCurva();
    firmeAttive[i].lx = p.x; firmeAttive[i].ly = p.y;
  }

  function stop(e) {
    if (!firmeAttive[i].disegnando) return;
    firmeAttive[i].disegnando = false;

    // Chiudi l'ultimo tratto rimasto nel buffer
    if (punti.length >= 2) {
      var p = punti[punti.length - 1];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(15, 25, 60, 0.7)';
      ctx.fill();
    }
    punti = [];

    firmeAttive[i].dataUrl = cv.toDataURL('image/png');
    firmeAttive[i].eraPortrait = isPortrait();
    document.getElementById('firma_box_' + i).className = 'firma-box firma-ok';
    document.getElementById('badge_' + i).className = 'firma-badge badge-ok';
    document.getElementById('badge_' + i).textContent = '✓ Firmato';
  }

  cv.addEventListener('mousedown', start);
  cv.addEventListener('mousemove', move);
  cv.addEventListener('mouseup', stop);
  cv.addEventListener('mouseleave', stop);
  cv.addEventListener('touchstart', start, {passive:false});
  cv.addEventListener('touchmove', move, {passive:false});
  cv.addEventListener('touchend', stop);
}

function pulisciFirma(i) {
  var cv = firmeAttive[i].canvas;
  firmeAttive[i].ctx.clearRect(0, 0, cv.width, cv.height);
  firmeAttive[i].dataUrl = null;
  document.getElementById('firma_box_' + i).className = 'firma-box';
  document.getElementById('badge_' + i).className = 'firma-badge badge-attesa';
  document.getElementById('badge_' + i).textContent = 'In attesa';
}

// ===== NOTIFICA TELEGRAM =====

// ===== INVIA =====
async function inviaFirme() {
  var mancanti = firmeAttive.filter(function(f){ return !f.dataUrl; });
  if (mancanti.length) {
    showToast('Devi firmare tutti i campi richiesti');
    return;
  }

  var btn = document.getElementById('btn_invia');
  btn.disabled = true; btn.textContent = '⏳ Elaborazione firma...';

  var luogo = document.getElementById('inp_luogo').value || '';
  var dataVal = document.getElementById('inp_data').value || '';
  var dataParts = dataVal.split('-');
  var dataFmt = dataParts.length === 3 ? dataParts[2]+'/'+dataParts[1]+'/'+dataParts[0] : dataVal;

  // Ruota le firme in portrait prima di salvarle
  var firmeElaborate = await Promise.all(firmeAttive.map(function(f){
    return new Promise(function(resolve){
      ruotaFirmaSeNecessario(f.dataUrl, f.eraPortrait||false, function(dataUrlOk){
        resolve({
          pagina: f.pagina || 1,
          dataUrl: dataUrlOk,
          pos: { xPct: f.xPct || 0, yPct: f.yPct || 0 }
        });
      });
    });
  }));

  try {
    await db.collection('mod_firmati').add({
      clienteId: (invioData && invioData.clienteId) || '',
      nomeCliente: (invioData && invioData.nomeCliente) || '',
      nomeModulo: (templateData && templateData.nome) || '',
      templateId: (invioData && invioData.templateId) || '',
      invioId: docInvioId || '',
      firmeData: firmeElaborate,
      luogo: luogo,
      data: dataFmt,
      numerofirme: firmeAttive.length,
      timestamp: new Date().toISOString()
    });
    notificaWhatsApp((invioData && invioData.nomeCliente) || '', (templateData && templateData.nome) || '');
    showStato('✅ Documento firmato con successo!', 'Grazie. Il consulente riceverà il documento firmato.', false);
  } catch(e) {
    btn.disabled = false; btn.textContent = '📤 Invia documento firmato';
    showToast('Errore: ' + e.message);
  }
}

init();
function isMobile(){ return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent); }
function isPortrait(){ return window.innerHeight > window.innerWidth; }

function aggiornaOverlay(){
  var inFirma = document.getElementById('schermo_firma').style.display !== 'none';
  var overlay = document.getElementById('rotate_overlay');
  if(isMobile() && isPortrait() && inFirma){
    overlay.classList.add('show');
  } else {
    overlay.classList.remove('show');
  }
}
window.addEventListener('orientationchange', function(){ setTimeout(aggiornaOverlay, 300); });
window.addEventListener('resize', aggiornaOverlay);

// Override showFirma per aggiornare overlay
var _showFirmaOrig = showFirma;
showFirma = function(){
  _showFirmaOrig();
  setTimeout(aggiornaOverlay, 100);
};

// ===== ROTAZIONE FIRMA NEL PDF =====
// Ruota il dataUrl della firma di 90° se catturata in portrait
function ruotaFirmaSeNecessario(dataUrl, eraPortrait, callback){
  if(!eraPortrait){ callback(dataUrl); return; }
  var img = new Image();
  img.onload = function(){
    // Ruota 90° antiorario per adattare al box orizzontale nel PDF
    var cv = document.createElement('canvas');
    cv.width = img.height; cv.height = img.width;
    var ctx = cv.getContext('2d');
    ctx.translate(cv.width/2, cv.height/2);
    ctx.rotate(-Math.PI/2);
    ctx.drawImage(img, -img.width/2, -img.height/2);
    callback(cv.toDataURL('image/png'));
  };
  img.src = dataUrl;
}
</script>
